[package]
name = "kl4a"
version = "0.0.2"
edition.workspace = true

[[bin]]
name = "kl4a"
path = "src/main.rs"

[dependencies]
# Siblings in this workspace (v2/kl4a-rs) -- ordinary path deps.
codekb = { path = "../codekb" }
# Crosses into the separate `sopkb-rust` workspace (its own Cargo.toml has its
# own [workspace], so it resolves `version.workspace = true` etc. against
# `sopkb-rust/Cargo.toml`'s [workspace.package], not this workspace's). Still
# an ordinary external path dependency from Cargo's point of view.
sopkb-cli = { path = "../sopkb-rust/bin/sopkb-cli" }
# Only needed to call `sopkb_cli::cli::Cli::try_parse_from` / inspect its
# `clap::Error` in the in-process sopkb dispatch path below -- no derive
# macros of our own, so the default feature set is enough.
clap = "4"
