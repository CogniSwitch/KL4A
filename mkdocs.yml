site_name: KL4A
site_description: >-
  KL4A (Knowledge Layer For Agents) — a local-first, open-source workbench that turns
  SOPs and source code into grounded, human-reviewed OKF Knowledge Bundles.
site_url: https://cogniswitch.github.io/KL4A/
repo_name: CogniSwitch/KL4A
repo_url: https://github.com/CogniSwitch/KL4A
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

# docs/README.md is the GitHub-browsing index for this folder (predates this
# mkdocs.yml) and would otherwise collide with docs/index.md, which is the
# real MkDocs homepage — exclude it from the built site rather than the nav.
exclude_docs: |
  README.md
  PARITY_CHECK_OPEN_GAPS.md
  # Internal launch-process documents - legitimate as repo artifacts, not for
  # the public docs site.
  LAUNCH_CHECKLIST.md
  SECURITY_SCAN_NOTES.md

validation:
  links:
    # Several pages intentionally link to root-level docs that live outside
    # docs_dir (CONTRIBUTING.md, LICENSE, ...) — real files, real links, just
    # not part of the site MkDocs builds. Downgrade below --strict-failing.
    not_found: info

# No plugins: key previously existed, which left MkDocs on its implicit
# default (just "search") - listing plugins explicitly now means "search"
# has to be named too, or it would silently drop out.
plugins:
  - search
  - llms-source

theme:
  name: material
  favicon: images/favicon.png
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    # Top-level nav entries become tabs: the SOP half and the code half are
    # separate products sharing one core, so they get a tab each rather than
    # competing for room in a single sidebar.
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/brand.css

extra_javascript:
  - javascripts/mermaid-theme.js

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - fenced_code
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home:
      - index.md
      - See KL4A in Action: see-kl4a-in-action.md
      - Why This Exists: WHY.md
      - Use Cases: use-cases.md
      - kl4a - Unified CLI & Library: kl4a.md
  - sopkb — SOP:
      - Quickstart: sopkb/quickstart.md
      - Guides:
          - Desktop UI Guide: sopkb/DESKTOP_UI_GUIDE.md
          - MCP Server: sopkb/MCP_SERVER.md
          - Architecture Overview: sopkb/ARCHITECTURE.md
          - FAQ: sopkb/FAQ.md
          - Beyond Retrieval (RAG Comparison): sopkb/rag-comparison.md
  - codekb — Code:
      - Overview: codekb/index.md
      - Getting Started: codekb/getting-started.md
      - Guides:
          - Workbench UI: codekb/workbench-ui.md
          - Pipeline & Mining: codekb/pipeline.md
          - Knowledge & Review: codekb/knowledge-and-review.md
          - Architecture Detection: codekb/architecture-detection.md
      - Consuming a bundle:
          - Agent Consumption: codekb/agent-consumption.md
          - MCP Server: codekb/mcp.md
      - Reference:
          - codekb CLI: codekb/cli.md
          - Architecture: codekb/architecture.md
          - Bundle State: codekb/bundle-state.md
          - Rust Port Parity: codekb/rust-port-parity.md
          - Quality Benchmark: codekb/benchmark-external-backend.md
  - Reference:
      - OKF Bundle Spec: OKF_BUNDLE_SPEC.md
      - Bundle Compatibility Policy: BUNDLE_COMPATIBILITY_POLICY.md
  - Project:
      - Roadmap: ROADMAP.md
      - Why Open Core: WHY_OPEN_CORE.md
      - Release Process: RELEASE_PROCESS.md
      - Post-Launch Operations: POST_LAUNCH_OPERATIONS.md
      - Release Notes:
          - v0.0.1: releases/v0.0.1.md
          - v0.0.2: releases/v0.0.2.md
