[package]
name = "sopkb-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sopkb-cli"
path = "src/main.rs"

[lib]
name = "sopkb_cli"
path = "src/lib.rs"

[dependencies]
sopkb-core = { path = "../../crates/sopkb-core" }
sopkb-config = { path = "../../crates/sopkb-config" }
sopkb-derive = { path = "../../crates/sopkb-derive" }
sopkb-mining = { path = "../../crates/sopkb-mining" }
sopkb-export = { path = "../../crates/sopkb-export" }
sopkb-review = { path = "../../crates/sopkb-review" }
sopkb-agent = { path = "../../crates/sopkb-agent" }
sopkb-fmt = { path = "../../crates/sopkb-fmt" }
sopkb-workbench = { path = "../../crates/sopkb-workbench" }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
serial_test = "3"
