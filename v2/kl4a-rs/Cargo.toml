[workspace]
resolver = "2"
members = ["codekb", "kl4a-core", "kl4a"]
# `sopkb-rust/` is a separate, independent Cargo workspace (its own
# `[workspace]`, own `Cargo.lock`) that happens to live in a subdirectory
# here. Without this exclude, Cargo's workspace-root search for `sopkb-cli`
# (a path dependency of `kl4a`, reached from inside *this* workspace's own
# resolution) treats it as if it needed to inherit `workspace.package.*` from
# *this* file instead of from `sopkb-rust/Cargo.toml`'s own
# `[workspace.package]` -- which fails, since this workspace never defined a
# `version`/`license` for sopkb-cli's `version.workspace = true` etc. to
# resolve against. Excluding the directory makes Cargo treat it purely as an
# external package tree again, so `sopkb-cli`'s own ancestor search correctly
# finds `sopkb-rust/Cargo.toml` as its workspace root.
exclude = ["sopkb-rust"]

[workspace.package]
edition = "2021"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
regex = "1"
sha2 = "0.10"
walkdir = "2"
tempfile = "3"
once_cell = "1"
rustpython-parser = "0.4"
ureq = "3"
kl4a-core = { path = "kl4a-core" }
