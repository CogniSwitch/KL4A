[package]
name = "sopkb-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
docx = ["dep:zip", "dep:quick-xml"]
# PDF normalization. Per CATCHUP_PLAN.md D2 this deliberately uses `lopdf` for
# low-level PDF structure only -- character positioning and all line/word
# reconstruction are hand-built to mirror pdfminer.six/pdfplumber, because the
# target is behavioral fidelity to that specific algorithm, not "good PDF
# extraction". Do not swap this for a high-level extraction crate.
pdf = ["dep:lopdf"]

[dependencies]
sopkb-fmt = { path = "../sopkb-fmt" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
zip = { version = "8.6.0", default-features = false, features = ["deflate"], optional = true }
quick-xml = { version = "0.41.0", optional = true }
lopdf = { version = "0.44", optional = true, default-features = false }

[dev-dependencies]
tempfile = "3"
regex = "1"

# Both examples are PDF differential-testing tools (they pair with
# fixtures/harness/dump_pdf.py and diff_normalize_pdf.py), so they only build
# when the feature they exercise is on -- otherwise a plain `cargo test -p
# sopkb-core` fails to compile them.
[[example]]
name = "pdf_dump"
required-features = ["pdf"]

[[example]]
name = "pdf_normalize"
required-features = ["pdf"]
