<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="'Archivo','Segoe UI',sans-serif"><rect x="0" y="0" width="1000" height="640" rx="0" fill="#f4f6fb" stroke="none" stroke-width="1" /><rect x="270" y="190" width="460" height="260" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" /><text x="500" y="234" font-family="'Archivo', 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#272048" text-anchor="middle">Workbench unavailable</text><text x="500" y="264" font-family="'Archivo', 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">The app could not open a workbench root. This usually means</text><text x="500" y="282" font-family="'Archivo', 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">the folder was moved or deleted, or its manifest is malformed.</text><rect x="310" y="306" width="380" height="30" rx="8" fill="#ffe4e6" stroke="none" stroke-width="1" /><text x="500" y="326" font-family="'Archivo', 'Segoe UI', sans-serif" font-size="10" font-weight="400" fill="#be123c" text-anchor="middle">Reason: manifest.json is malformed at line 3</text><rect x="310" y="356" width="320" height="30" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1" /><text x="322" y="376" font-family="'Archivo', 'Segoe UI', sans-serif" font-size="10.5" font-weight="400" fill="#94a3b8" text-anchor="start">Point at a different folder…</text><rect x="640" y="356" width="50" height="30" rx="15" fill="#0808ba" stroke="#0808ba" stroke-width="1" /><text x="665" y="375" font-family="'Archivo', 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Switch</text><rect x="310" y="400" width="70" height="28" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" /><text x="345" y="418" font-family="'Archivo', 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#272048" text-anchor="middle">Retry</text><rect x="390" y="400" width="130" height="28" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" /><text x="455" y="418" font-family="'Archivo', 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#272048" text-anchor="middle">Browse for a folder…</text><rect x="832" y="16" width="148" height="24" rx="12" fill="#111827" /><text x="906" y="32" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.04em">ILLUSTRATIVE WIREFRAME</text></svg>